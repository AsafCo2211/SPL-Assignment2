name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Tests and examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Unit tests and package
        run: mvn -B package

      - name: Check every example against its expected output
        run: scripts/check-examples.sh

      - uses: actions/upload-artifact@v7
        with:
          name: engine-jar
          path: target/parallel-matrix-engine-*.jar

  benchmark:
    name: Thread-scaling benchmark
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: engine-jar

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Multiply two 800x800 matrices with 1, 2, 4 and 8 threads
        run: |
          java -cp parallel-matrix-engine-*.jar spl.lae.Benchmark 800 5 1 2 4 8 | tee benchmark.md
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
          grep '^|' benchmark.md | while read -r line; do echo "::notice title=benchmark::$line"; done
